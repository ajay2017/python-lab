[deploy]
startCommand = "python cron_runner.py"
# Records intent only. Railway does not restart cron-scheduled services at
# all ("Services with a cron schedule do not have a restart policy" --
# Railway dashboard, verified 2026-10-12), so a run that exits non-zero
# simply ends and the lane runs again at its next scheduled slot. That
# behaviour is what the D-M1/D-M2 failure contract relies on: each failed
# run sends ONE cron-failure email and is never retried. Kept explicit so
# nothing changes if this config is ever reused for a non-cron service.
restartPolicyType = "never"
