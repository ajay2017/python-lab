name: Docs sync check

# Doc-sync tripwire (CLAUDE.md "Definition of Done"). Fails loudly when a new
# module-level constant in stock_analyzer/constants.py is neither documented in
# docs/ nor listed in scripts/constants_doc_allowlist.txt. Catches the highest-
# frequency doc-drift class — a decision threshold shipping without a docs entry
# (the class that hid EARNINGS_MIN_BEAT_RATE_ENTRY / PERF_ALPHA_BAND_PCT for days
# in July 2026). Pure stdlib; no install step.

on:
  push:
    branches: [main]
    paths:
      - "stock_analyzer/constants.py"
      - "docs/architecture.md"
      - "docs/requirements.md"
      - "scripts/check_constants_documented.py"
      - "scripts/constants_doc_allowlist.txt"
      # The gate must re-validate itself when its OWN definition changes.
      # Without this, the 2026-08-28 python-version pin (3.x -> 3.12, i.e. a
      # change to which interpreter every check runs on) landed WITHOUT
      # running a single check, and could only be verified on some later,
      # unrelated code push.
      - ".github/workflows/**"
  pull_request:
    paths:
      - "stock_analyzer/constants.py"
      - "docs/architecture.md"
      - "docs/requirements.md"
      - "scripts/check_constants_documented.py"
      - "scripts/constants_doc_allowlist.txt"
      # The gate must re-validate itself when its OWN definition changes.
      # Without this, the 2026-08-28 python-version pin (3.x -> 3.12, i.e. a
      # change to which interpreter every check runs on) landed WITHOUT
      # running a single check, and could only be verified on some later,
      # unrelated code push.
      - ".github/workflows/**"
  workflow_dispatch: {}

jobs:
  constants-documented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          # Match runtime.txt / production (see tests.yml for the full note).
          python-version: "3.12"
      - name: Check every constant is documented or allowlisted
        run: python scripts/check_constants_documented.py
