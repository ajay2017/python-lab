name: Regression tests

# Runs the tests/ pytest suite against stock_analyzer/ pure-logic modules —
# scoring, gates, thresholds. Does NOT gate the Streamlit Cloud / Railway
# deploy (neither consults GitHub Actions); this is a pre-push safety net so a
# regression shows up as a red X on the commit instead of only being found by
# hand-testing production after redeploy. See docs/plans/test-automation.md.

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "cron_runner.py"
      - "stock_analyzer/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pytest.ini"
      # The gate must re-validate itself when its OWN definition changes.
      # Without this, the 2026-08-28 python-version pin (3.x -> 3.12, i.e. a
      # change to which interpreter every check runs on) landed WITHOUT
      # running a single check, and could only be verified on some later,
      # unrelated code push.
      - ".github/workflows/**"
  pull_request:
    paths:
      - "app.py"
      - "cron_runner.py"
      - "stock_analyzer/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pytest.ini"
      # The gate must re-validate itself when its OWN definition changes.
      # Without this, the 2026-08-28 python-version pin (3.x -> 3.12, i.e. a
      # change to which interpreter every check runs on) landed WITHOUT
      # running a single check, and could only be verified on some later,
      # unrelated code push.
      - ".github/workflows/**"
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Must match runtime.txt (python-3.12), which is what Railway
          # actually deploys. "3.x" resolved to 3.14.7 on 2026-08-28 — two
          # minor versions AHEAD of production — so the gate that is supposed
          # to block a broken push was validating an interpreter the app never
          # runs on. A 3.13/3.14-only construct would have passed here and
          # crashed on deploy. alerts.yml and backfill-analyst-prices.yml
          # already pinned 3.12; only the three GATE workflows had drifted.
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest
        run: pytest tests/ -v
