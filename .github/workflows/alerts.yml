name: Protective Alerts (daily)

# Exit-discipline Phase 3 — recompute protective signals headlessly and email
# the user once per ET trading day when the action set changes.
#
# MIGRATION IN PROGRESS (2026-08-07): scheduled lanes are moving to Railway
# native Cron Job services, one at a time, because GitHub's `schedule` trigger
# is documented as best-effort and was hit by a platform-wide incident on
# 2026-08-06 that silently dropped/cancelled runs. See memory
# `project_cron_railway_migration` for the full rationale and per-lane cron
# expressions. premarket, scan and intraday are DONE (now run on Railway
# services `cron-premarket`/`cron-scan`/`cron-intraday`, project
# `endearing-magic`) — their schedule entries below are removed. Remaining
# lanes here still use the old GitHub dual-UTC-slot DST trick: (trading-day
# + ET-hour gate + a once-per-day Supabase flag) ensure exactly one run
# fires per ET day, never twice.

on:
  schedule:
    # EOD run (~16:30 ET, post-close) — snapshot write + reactive pullback. Two UTC
    # slots straddle EST/EDT; the cron derives mode=eod for ET hour >= 12 and gates
    # on ET hour >= 16 so the close is final.
    - cron: "30 20 * * 1-5"  # 20:30 UTC — 16:30 EDT (summer run) / 15:30 EST (gated too-early)
    - cron: "30 21 * * 1-5"  # 21:30 UTC — 17:30 EDT (already-done) / 16:30 EST (winter run)
    # Weekly THESIS REVIEW — Sunday evening. Two UTC slots straddle EST/EDT;
    # cron_runner gates on mode=thesis and runs only on Sunday (weekday=6).
    - cron: "0 22 * * 0"     # 22:00 UTC Sunday — 18:00 EDT / 17:00 EST
    - cron: "0 23 * * 0"     # 23:00 UTC Sunday — 19:00 EDT / 18:00 EST (winter run)
  workflow_dispatch:          # manual button (Actions tab → Run workflow)
    inputs:
      mode:
        description: "Run mode: auto=derive from ET hour, scan=force mid-morning scan, intraday=force intraday pullback check, thesis=force weekly thesis review, debrief=force weekly portfolio debrief, monthly=force monthly intelligence report"
        type: choice
        options: [auto, scan, intraday, thesis, debrief, monthly]
        default: auto
      force:
        description: "Bypass the trading-day / hour / once-per-day guards (test)"
        type: boolean
        default: false
      test_email:
        description: "Send a delivery-test email (proves Resend → inbox), then stop without touching dedup state"
        type: boolean
        default: false

concurrency:
  group: protective-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run protective-alert cron
        env:
          SUPABASE_URL:    ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:    ${{ secrets.SUPABASE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY:     ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY:    ${{ secrets.FRED_API_KEY }}
          RESEND_API_KEY:   ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO:   ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALERT_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}
          ALERT_TEST_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.test_email && '1' || '' }}
          # workflow_dispatch input wins; else named schedule slots force their mode;
          # all other slots leave it blank so the cron derives premarket/eod by hour.
          ALERT_RUN_MODE: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'auto' && inputs.mode
            || ((github.event.schedule == '0 22 * * 0'   || github.event.schedule == '0 23 * * 0')   && 'thesis')
            || '' }}
        run: python cron_runner.py

      # Dead-man's-switch — if any step above fails (install error, uncaught
      # exception, or a lane returning a non-zero exit) OR the job is cancelled
      # (e.g. hitting the 15-min timeout during a GitHub Actions platform
      # incident — confirmed on 2026-08-06, when 3 intraday-slot runs were
      # cancelled with zero steps executed and `failure()` alone stayed silent),
      # email a notice so a broken cron isn't invisible. Reuses the same Resend
      # secrets; inert if they aren't set. NOTE: even `cancelled()` can't catch
      # every case — if the runner never becomes usable at all (steps: [] with
      # no runner ever picking up the job), there may be no runner left to
      # execute this step either. It also can't catch GitHub silently disabling
      # the schedule after 60d repo inactivity, nor a "ran green but fetched
      # nothing" run; pair with an external heartbeat monitor (e.g.
      # healthchecks.io) for those.
      - name: Notify on failure (dead-man's-switch)
        if: ${{ failure() || cancelled() }}
        env:
          RESEND_API_KEY:   ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO:   ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_OUTCOME: ${{ job.status }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$ALERT_EMAIL_TO" ] || [ -z "$ALERT_EMAIL_FROM" ]; then
            echo "failure-notify: Resend secrets not set — skipping (inert)."
            exit 0
          fi
          payload=$(jq -n --arg from "$ALERT_EMAIL_FROM" --arg to "$ALERT_EMAIL_TO" --arg url "$RUN_URL" --arg outcome "$RUN_OUTCOME" \
            '{from:$from, to:[$to],
              subject:("⚠️ DRISHTA protective-alerts cron " + ($outcome | ascii_upcase)),
              html:("<p>The protective-alerts cron run was " + $outcome + " — protective emails for this slot may NOT have been sent.</p><p><a href=\"" + $url + "\">View the run</a></p>")}')
          code=$(curl -sS -o /tmp/resend_resp -w "%{http_code}" -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload" || echo "000")
          echo "failure-notify: HTTP $code"
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "failure-notify: sent."
          else
            echo "failure-notify: send failed."; cat /tmp/resend_resp 2>/dev/null || true
          fi
