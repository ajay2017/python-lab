name: Protective Alerts (daily)

# Exit-discipline Phase 3 — recompute protective signals headlessly and email
# the user once per ET trading day when the action set changes.
#
# DST: GitHub cron is UTC with no DST. We schedule TWO slots straddling EST/EDT
# (08:00 ET = 13:00 UTC in winter / 12:00 UTC in summer). cron_runner's guards
# (trading-day + ET-hour >= ALERT_EMAIL_HOUR_ET + a once-per-day Supabase flag)
# ensure exactly one run fires per ET day at ~08:00 local, never twice.

on:
  schedule:
    # Pre-market PROTECTIVE run (~08:00 ET). Two UTC slots straddle EST/EDT; the
    # cron derives mode=premarket for ET hour < 12.
    - cron: "0 12 * * 1-5"   # 12:00 UTC — 08:00 EDT / 07:00 EST (gated too-early in winter)
    - cron: "0 13 * * 1-5"   # 13:00 UTC — 09:00 EDT (already-done) / 08:00 EST (winter run)
    # Mid-morning SCAN + buy-list run (~9:45 ET). Scans the sector universe,
    # persists it to scanner_cache (cold-load buy candidates) AND emails the
    # high-conviction "New Positions to Initiate". Two UTC slots straddle EST/EDT;
    # cron_runner gates on post-open (ET ≥ 9:30) so the pre-open winter slot is
    # skipped, and the buy-email dedups (alert_state row 3) so the redundant
    # post-open slot doesn't double-send. The ALERT_RUN_MODE mapping forces
    # mode=scan for these cron strings (their ET hour < 12 would else derive premarket).
    - cron: "45 13 * * 1-5"  # 13:45 UTC — 09:45 EDT (summer run) / 08:45 EST (gated pre-open)
    - cron: "45 14 * * 1-5"  # 14:45 UTC — 10:45 EDT (already-done) / 09:45 EST (winter run)
    # EOD run (~16:30 ET, post-close) — snapshot write + reactive pullback. Two UTC
    # slots straddle EST/EDT; the cron derives mode=eod for ET hour >= 12 and gates
    # on ET hour >= 16 so the close is final.
    - cron: "30 20 * * 1-5"  # 20:30 UTC — 16:30 EDT (summer run) / 15:30 EST (gated too-early)
    - cron: "30 21 * * 1-5"  # 21:30 UTC — 17:30 EDT (already-done) / 16:30 EST (winter run)
    # Weekly THESIS REVIEW — Sunday evening. Two UTC slots straddle EST/EDT;
    # cron_runner gates on mode=thesis and runs only on Sunday (weekday=6).
    - cron: "0 22 * * 0"     # 22:00 UTC Sunday — 18:00 EDT / 17:00 EST
    - cron: "0 23 * * 0"     # 23:00 UTC Sunday — 19:00 EDT / 18:00 EST (winter run)
  workflow_dispatch:          # manual button (Actions tab → Run workflow)
    inputs:
      mode:
        description: "Run mode: auto=derive from ET hour, scan=force mid-morning scan"
        type: choice
        options: [auto, scan]
        default: auto
      force:
        description: "Bypass the trading-day / hour / once-per-day guards (test)"
        type: boolean
        default: false
      test_email:
        description: "Send a delivery-test email (proves Resend → inbox), then stop without touching dedup state"
        type: boolean
        default: false

concurrency:
  group: protective-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run protective-alert cron
        env:
          SUPABASE_URL:    ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:    ${{ secrets.SUPABASE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY:     ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY:    ${{ secrets.FRED_API_KEY }}
          RESEND_API_KEY:   ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO:   ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALERT_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}
          ALERT_TEST_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.test_email && '1' || '' }}
          # workflow_dispatch input wins; else named schedule slots force their mode;
          # all other slots leave it blank so the cron derives premarket/eod by hour.
          ALERT_RUN_MODE: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'auto' && inputs.mode
            || ((github.event.schedule == '45 13 * * 1-5' || github.event.schedule == '45 14 * * 1-5') && 'scan')
            || ((github.event.schedule == '0 22 * * 0'   || github.event.schedule == '0 23 * * 0')   && 'thesis')
            || '' }}
        run: python cron_runner.py
